[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-quality-lab"
version = "0.1.0"
description = "A reproducible lab for testing tool-using SaaS agents"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
agent-quality-lab = "agent_quality_lab.cli:main"

[tool.setuptools.packages.find]
include = ["agent_quality_lab*"]

[tool.setuptools.package-data]
agent_quality_lab = ["demo_data.json"]
